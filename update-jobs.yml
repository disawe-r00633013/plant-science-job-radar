name: Update US plant science jobs and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
      timezone: 'Asia/Taipei'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: plant-science-career-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Search US jobs
        run: python scripts/fetch_jobs.py

      - name: Commit updated job data
        run: |
          git config user.name "career-radar[bot]"
          git config user.email "career-radar[bot]@users.noreply.github.com"
          git add data/jobs.json data/status.json data/jobs.previous.json 2>/dev/null || git add data/jobs.json data/status.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update US plant science jobs"
            git push
          fi

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html style.css app.js config.json .nojekyll _site/
          cp data/jobs.json data/status.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: update
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
